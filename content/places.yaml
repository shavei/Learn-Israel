# The curriculum: the frame, anchor cities, natural regions, about 120 cities and
# towns, and the districts.
# Source of truth for WHAT is taught. Geometry is attached by tools/build_content.py.
#
# geometry sources:
#   country:<ADM0_A3>   Natural Earth admin-0 country, clipped to the map window
#   sea:<lon>,<lat>     the open-water area containing this seed point
#   lake:<name>         Natural Earth lake polygon(s) with this English name
#   river:<name>        Natural Earth river centerline(s) with this English name
#   cbs:<symbol>        a locality's official point from the CBS locality file
#                       (content/localities.csv), by its locality symbol
#   geonames:<id>       GeoNames city point (CC BY 4.0), for cities the CBS does not list
#   point:<lon>,<lat>   a point (here: Jericho, from OpenStreetMap; GeoNames is 1.4 km off)
#   region:<key>        a game region from content/regions.yaml (official natural regions)
#   district:<key>      a district, built from the official natural regions
#                       (judea_samaria: the natural regions of Judea and Samaria)
#
# aliases: other accepted spellings for typed answers (niqqud, punctuation, spaces,
#   final letters and doubled yod/vav are already ignored by the matcher).
# confusables: places players mix up with this one (pairs are made symmetric).
#
# importance: 1 (introduce first) to 5. unit groups places introduced together;
#   units are taught in the order they first appear in this file.

places:
  # ---------- Unit: frame (waters and neighbors) ----------
  - id: sea.mediterranean
    type: sea
    unit: frame
    importance: 1
    geometry: sea:34.3,32.5
    name: הים התיכון
    hint: לאורך כל החוף המערבי של ישראל
    fact: כל ערי החוף הגדולות, מאשקלון ועד נהריה, יושבות לחופו.
    aliases: [ים התיכון, הים הגדול]
  - id: sea.gulf_of_eilat
    type: sea
    unit: frame
    importance: 1
    geometry: sea:34.93,29.35
    name: מפרץ אילת
    hint: בקצה הדרומי של ישראל
    fact: זרוע של ים סוף. היציאה הימית של ישראל לאסיה ולאפריקה.
    aliases: [ים סוף, מפרץ עקבה]
  - id: lake.kinneret
    type: lake
    unit: frame
    importance: 1
    geometry: lake:Sea of Galilee
    name: הכנרת
    hint: בצפון מזרח, בין הגליל לרמת הגולן
    fact: אגם המים המתוקים הגדול בישראל. נהר הירדן עובר דרכו.
    aliases: [כנרת, ים כנרת, ים הכנרת, ים גליל]
  - id: lake.dead_sea
    type: lake
    unit: frame
    importance: 1
    geometry: lake:Dead Sea
    name: ים המלח
    hint: במזרח, על הגבול עם ירדן
    fact: חופיו הם המקום הנמוך ביותר על פני היבשה בכדור הארץ.
  - id: river.jordan
    type: river
    unit: frame
    importance: 2
    geometry: river:Jordan
    name: נהר הירדן
    hint: מחבר את הכנרת לים המלח
    fact: זורם מצפון אל הכנרת, וממנה דרומה עד ים המלח.
    aliases: [הירדן]
  - id: country.lebanon
    type: country
    unit: frame
    importance: 2
    geometry: country:LBN
    name: לבנון
    hint: מצפון לישראל
    fact: הגבול עם לבנון עובר לאורך הגליל העליון, מראש הנקרה ועד החרמון.
    confusables: [country.syria]
  - id: country.syria
    type: country
    unit: frame
    importance: 2
    geometry: country:SYR
    name: סוריה
    hint: מצפון מזרח, מעבר לרמת הגולן
    fact: רמת הגולן מפרידה בין עמק החולה והכנרת לבין סוריה.
  - id: country.jordan
    type: country
    unit: frame
    importance: 2
    geometry: country:JOR
    name: ירדן
    hint: ממזרח, לאורך הירדן, ים המלח והערבה
    fact: הגבול הארוך ביותר של ישראל, מהירמוך ועד מפרץ אילת.
  - id: country.egypt
    type: country
    unit: frame
    importance: 2
    geometry: country:EGY
    name: מצרים
    hint: מדרום מערב, חצי האי סיני
    fact: הגבול עם מצרים חוצה את המדבר, מרצועת עזה ועד טאבה ליד אילת.

  # ---------- Unit: big anchors ----------
  - id: city.jerusalem
    type: city
    unit: anchors
    importance: 1
    geometry: cbs:3000
    name: ירושלים
    hint: בהרי יהודה, במרכז הארץ
    fact: בירת ישראל והעיר הגדולה בה.
  - id: city.tel_aviv
    type: city
    unit: anchors
    importance: 1
    geometry: cbs:5000
    name: תל אביב-יפו
    hint: על חוף הים, במרכז הארץ
    fact: לב גוש דן, המטרופולין הגדול בישראל.
    aliases: [תל אביב, תל אביב יפו, תא]
  - id: city.haifa
    type: city
    unit: anchors
    importance: 1
    geometry: cbs:4000
    name: חיפה
    hint: בצפון, על החוף, למרגלות הכרמל
    fact: עיר הנמל הגדולה בצפון, על מורדות הר הכרמל.
  - id: city.beersheba
    type: city
    unit: anchors
    importance: 1
    geometry: cbs:9000
    name: באר שבע
    hint: בצפון הנגב
    fact: מכונה "בירת הנגב". העיר הגדולה בדרום הארץ.
    aliases: [בש, באר-שבע]
    confusables: [city.dimona]
  - id: city.eilat
    type: city
    unit: anchors
    importance: 1
    geometry: cbs:2600
    name: אילת
    hint: בקצה הדרומי, על מפרץ אילת
    fact: העיר הדרומית ביותר בישראל.

  # ---------- Unit: the big regions ----------
  - id: region.upper_galilee
    type: region
    unit: regions_main
    importance: 1
    geometry: region:upper_galilee
    name: הגליל העליון
    hint: בצפון, בין גבול לבנון לבקעת בית הכרם
    fact: האזור ההררי הגבוה בגליל, ובו הר מירון.
    aliases: [גליל עליון]
    confusables: [region.lower_galilee]
  - id: region.lower_galilee
    type: region
    unit: regions_main
    importance: 1
    geometry: region:lower_galilee
    name: הגליל התחתון
    hint: בין בקעת בית הכרם לעמק יזרעאל
    fact: הרים נמוכים ועמקים רחבים, מנצרת ועד הכנרת.
    aliases: [גליל תחתון]
  - id: region.golan
    type: region
    unit: regions_main
    importance: 1
    geometry: region:golan
    name: רמת הגולן
    hint: ממזרח לכנרת ולעמק החולה
    fact: רמה בזלתית שנוצרה מפעילות געשית. בצפונה מתנשא החרמון.
    aliases: [הגולן, גולן]
  - id: region.gush_dan
    type: region
    unit: regions_main
    importance: 1
    geometry: region:gush_dan
    name: גוש דן
    hint: סביב תל אביב, במרכז החוף
    fact: האזור העירוני הגדול והצפוף בישראל.
  - id: region.sharon
    type: region
    unit: regions_main
    importance: 1
    geometry: region:sharon
    name: השרון
    hint: מישור החוף שבין הירקון לכרמל
    fact: בעבר ביצות וחורש אלונים, והיום פרדסים וערים.
    aliases: [שרון]
  - id: region.judean_mountains
    type: region
    unit: regions_main
    importance: 1
    geometry: region:judean_mountains
    name: הרי יהודה
    hint: במרכז הארץ, סביב ירושלים
    fact: רכס ההרים שעליו יושבות ירושלים, בית לחם וחברון.
    aliases: [הרי ירושלים, הרי חברון]
    confusables: [region.samaria]
  - id: region.negev
    type: region
    unit: regions_main
    importance: 1
    geometry: region:negev
    name: הנגב
    hint: כל הדרום, מבאר שבע ועד הרי אילת
    fact: מדבר שתופס יותר ממחצית משטח ישראל.
    aliases: [נגב]
  - id: region.arava
    type: region
    unit: regions_main
    importance: 2
    geometry: region:arava
    name: הערבה
    hint: לאורך גבול ירדן, מים המלח ועד אילת
    fact: עמק מדברי צר בבקע ים המלח, ובו חקלאות במדבר.
    aliases: [ערבה]

