  # ---------- Unit: north ----------
  - id: city.akko
    type: city
    unit: north
    importance: 2
    geometry: cbs:7600
    name: עכו
    hint: בצפון מפרץ חיפה
    fact: העיר העתיקה שלה היא אתר מורשת עולמית.
