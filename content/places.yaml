# The curriculum: the frame, anchor cities, natural regions, about 120 cities and
# towns, and the districts (tiers 0 to 3), then nature, infrastructure and heritage
# (tiers 4 to 6).
# Source of truth for WHAT is taught. Geometry is attached by tools/build_content.py.
#
# geometry sources:
#   country:<ADM0_A3>   Natural Earth admin-0 country, clipped to the map window
#   sea:<lon>,<lat>     the open-water area containing this seed point
#   lake:<name>         Natural Earth lake polygon(s) with this English name
#   river:<name>        Natural Earth river centerline(s) with this English name
#   cbs:<symbol>        a locality's official point from the CBS locality file
#                       (content/localities.csv), by its locality symbol
#   geonames:<id>       GeoNames city point (CC BY 4.0), for cities the CBS does not list
#   point:<lon>,<lat>   a point (here: Jericho, from OpenStreetMap; GeoNames is 1.4 km off)
#   region:<key>        a game region from content/regions.yaml (official natural regions)
#   district:<key>      a district, built from the official natural regions
#                       (judea_samaria: the natural regions of Judea and Samaria)
#   osm:<way|relation>/<id>  an OpenStreetMap way or relation: a river's main stream, or
#                       a crater's length (OSM maps craters as a line along the valley)
#   road:<number>       every main road way that carries this highway number in OSM
#   (osm: and road: geometry comes from content/osm_places.geojson, which
#   tools/fetch_sources.py downloads; points of tiers 4 to 6 are copied from the OSM
#   object named in the comment beside them)
#
# tolerance_km: how close a tap must be for a well known place, when the type's
#   default does not fit (a long ridge such as the Carmel).
#
# aliases: other accepted spellings for typed answers (niqqud, punctuation, spaces,
#   final letters and doubled yod/vav are already ignored by the matcher).
# confusables: places players mix up with this one (pairs are made symmetric).
#
# importance: 1 (introduce first) to 5. unit groups places introduced together;
#   units are taught in the order they first appear in this file.

places:
  # ---------- Unit: frame (waters and neighbors) ----------
  - id: sea.mediterranean
    type: sea
    unit: frame
    importance: 1
    geometry: sea:34.3,32.5
    name: הים התיכון
    hint: לאורך כל החוף המערבי של ישראל
    fact: כל ערי החוף הגדולות, מאשקלון ועד נהריה, יושבות לחופו.
    aliases: [ים התיכון, הים הגדול]
  - id: sea.gulf_of_eilat
    type: sea
    unit: frame
    importance: 1
    geometry: sea:34.93,29.35
    name: מפרץ אילת
    hint: בקצה הדרומי של ישראל
    fact: זרוע של ים סוף. היציאה הימית של ישראל לאסיה ולאפריקה.
    aliases: [ים סוף, מפרץ עקבה]
  - id: lake.kinneret
    type: lake
    unit: frame
    importance: 1
    geometry: lake:Sea of Galilee
    name: הכנרת
    hint: בצפון מזרח, בין הגליל לרמת הגולן
    fact: אגם המים המתוקים הגדול בישראל. נהר הירדן עובר דרכו.
    aliases: [כנרת, ים כנרת, ים הכנרת, ים גליל]
  - id: lake.dead_sea
    type: lake
    unit: frame
    importance: 1
    geometry: lake:Dead Sea
    name: ים המלח
    hint: במזרח, על הגבול עם ירדן
    fact: חופיו הם המקום הנמוך ביותר על פני היבשה בכדור הארץ.
  - id: river.jordan
    type: river
    unit: frame
    importance: 2
    geometry: river:Jordan
    name: נהר הירדן
    hint: מחבר את הכנרת לים המלח
    fact: זורם מצפון אל הכנרת, וממנה דרומה עד ים המלח.
    aliases: [הירדן]
  - id: country.lebanon
    type: country
    unit: frame
    importance: 2
    geometry: country:LBN
    name: לבנון
    hint: מצפון לישראל
    fact: הגבול עם לבנון עובר לאורך הגליל העליון, מראש הנקרה ועד החרמון.
    confusables: [country.syria]
  - id: country.syria
    type: country
    unit: frame
    importance: 2
    geometry: country:SYR
    name: סוריה
    hint: מצפון מזרח, מעבר לרמת הגולן
    fact: רמת הגולן מפרידה בין עמק החולה והכנרת לבין סוריה.
  - id: country.jordan
    type: country
    unit: frame
    importance: 2
    geometry: country:JOR
    name: ירדן
    hint: ממזרח, לאורך הירדן, ים המלח והערבה
    fact: הגבול הארוך ביותר של ישראל, מהירמוך ועד מפרץ אילת.
  - id: country.egypt
    type: country
    unit: frame
    importance: 2
    geometry: country:EGY
    name: מצרים
    hint: מדרום מערב, חצי האי סיני
    fact: הגבול עם מצרים חוצה את המדבר, מרצועת עזה ועד טאבה ליד אילת.

  # ---------- Unit: big anchors ----------
  - id: city.jerusalem
    type: city
    unit: anchors
    importance: 1
    geometry: cbs:3000
    name: ירושלים
    hint: בהרי יהודה, במרכז הארץ
