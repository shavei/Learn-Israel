    aliases: [רמות מנשה]
    confusables: [region.carmel_coast]

  # ---------- Unit: more regions, center and east ----------
  - id: region.jordan_valley
    type: region
    unit: regions_center
    importance: 2
    geometry: region:jordan_valley
    name: בקעת הירדן
    hint: לאורך הירדן, מסביב לכנרת ועד ים המלח
