  # ---------- Unit: north ----------
  - id: city.akko
    type: city
    unit: north
    importance: 2
    geometry: cbs:7600
    name: עכו
    hint: בצפון מפרץ חיפה
    fact: העיר העתיקה שלה היא אתר מורשת עולמית.
    confusables: [city.nahariya]
  - id: city.nahariya
    type: city
    unit: north
    importance: 3
    geometry: cbs:9100
    name: נהריה
    hint: על החוף, צפונית לעכו
    fact: עיר החוף הצפונית ביותר בישראל.
  - id: city.nazareth
    type: city
    unit: north
    importance: 2
    geometry: cbs:7300
    name: נצרת
    hint: בגליל התחתון
    fact: העיר הערבית הגדולה בישראל.
    confusables: [city.afula]
  - id: city.afula
