# Natural regions of the game, built from the official natural regions.
#
# Each game region is a union of official natural regions (אזורים טבעיים), listed by
# code from content/natural_regions.geojson:
#   - inside Israel: the Central Bureau of Statistics regions (2018),
#   - in Judea and Samaria: the Ministry of Agriculture regions (codes 711 to 815).
# tools/fetch_natural_regions.py downloads them. The pipeline clips the union to the
# map's land and lakes; where the official borders and the map's coast or border
# disagree by a few hundred meters, the nearest region takes the strip. Every code
# must be used exactly once.

regions:
  golan: [291, 292, 293, 294]                # Hermon, northern, middle and southern Golan
  hula: [211]                                # Hula Valley
  upper_galilee: [212, 213, 243, 244]        # eastern Upper Galilee, Hazor, Yehi'am, Elon
  western_galilee: [245, 246]                # Nahariya and Akko regions
  lower_galilee: [214, 222, 233, 237, 241, 242]  # central and eastern Lower Galilee, Kokhav Plateau,
                                             # Nazareth-Tir'an hills, Shefar'am, Karmiel
  jezreel: [232, 234, 235]                   # Harod Valley, Jezreel Valley, Yokneam region
  jordan_valley: [221, 231, 711, 712]        # Kinnerot, Beit She'an Valley, north and south Jordan Valley
  haifa: [311]                               # Haifa region: the city, the Krayot, the northern Carmel
  carmel_coast: [321, 322]                   # Hof HaCarmel and the Zikhron Ya'akov region
  menashe: [236]                             # Menashe Plateau
  samaria: [323, 811]                        # Alexander Mountain (Wadi Ara, Umm al-Fahm) and Samaria
  sharon: [324, 411, 412, 421]               # Hadera region, western, eastern and southern Sharon
  gush_dan: [422, 432, 442, 511, 512, 513]   # Petah Tikva, Ramla, Rishon LeZion, Tel Aviv, Ramat Gan, Holon
  south_coast: [441, 611, 613, 614]          # Rehovot, Malakhi, Ashdod, Ashkelon
  shephelah: [112, 431, 612]                 # Judean Foothills, Modi'in, Lakhish
  judean_mountains: [111, 812, 813, 815]     # Judean Mountains, Judea, Gush Etzion, Hebron hills
  judean_desert: [624, 814]                  # Dead Sea region, Megilot
  negev: [621, 622, 623, 626, 627]           # Gerar, Besor, Be'er Sheva, northern and southern Negev Mountains
  arava: [625]                               # Arava
