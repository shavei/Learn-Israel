# Natural regions: hand-drawn sketches, in lon/lat.
#
# OpenStreetMap has no boundaries for Israel's natural regions (only label points),
# and their edges are fuzzy anyway, so they are sketched here and refined by
# tools/build_content.py:
#   - each sketch is clipped to the land (the coast and borders come from the map data)
#     and the lakes are cut out,
#   - order matters: a region keeps only what earlier regions did not take, so the
#     regions never overlap and neighbors share one border. That is also why outer
#     edges can be generous (they reach past the coast or the border).
# Internal borders follow valleys, streams and ridges where they are commonly drawn.
# Every place on the land must fall inside some region (the pipeline checks this).

