name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, content and screen tests
        run: ./gradlew test
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: mapa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Every push to main republishes the APK at one fixed link (see README "Install").
  publish-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, content]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mapa-debug-apk
      - name: Replace the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk mapa.apk
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build mapa.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build (#$GITHUB_RUN_NUMBER)" \
            --notes "Debug build of main at $GITHUB_SHA, published automatically by CI. Install mapa.apk on an Android phone (8.0 or newer)."

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Rebuild assets from sources
        run: python3 tools/build_content.py
      - name: Committed assets match the pipeline
        run: git diff --exit-code -- app/src/main/assets
